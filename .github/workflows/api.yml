name: API
on:
  push:
    paths:
      - "apps/api/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/api.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
        working-directory: apps/api
      - run: |
          bun run build
          bun run lint
        working-directory: apps/api
      - run: docker compose -f apps/api/compose.yaml config --quiet
